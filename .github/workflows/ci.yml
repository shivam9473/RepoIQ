name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codeatlas
          POSTGRES_PASSWORD: codeatlas
          POSTGRES_DB: codeatlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codeatlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build shared packages
        run: |
          npm run build -w shared
          npm run build -w parser
          npm run build -w embedding-service
          npm run build -w vector-service
          npm run build -w ai-service

      - name: Build backend & workers
        run: |
          npm run build -w backend
          npm run build -w workers

      - name: Build frontend
        run: npm run build -w frontend

      - name: Typecheck frontend
        run: npm run lint -w frontend
