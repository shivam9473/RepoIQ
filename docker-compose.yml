services:
  postgres:
    image: postgres:16-alpine
    container_name: codeatlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: codeatlas
      POSTGRES_PASSWORD: codeatlas
      POSTGRES_DB: codeatlas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeatlas"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: codeatlas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: codeatlas-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://codeatlas:codeatlas@postgres:5432/codeatlas
      REDIS_URL: redis://redis:6379
      API_URL: http://localhost:4000
      APP_URL: http://localhost:5173
    ports:
      - "4000:4000"
    volumes:
      - repos:/app/repos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  workers:
    build:
      context: .
      dockerfile: workers/Dockerfile
    container_name: codeatlas-workers
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://codeatlas:codeatlas@postgres:5432/codeatlas
      REDIS_URL: redis://redis:6379
    volumes:
      - repos:/app/repos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: codeatlas-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  repos:
